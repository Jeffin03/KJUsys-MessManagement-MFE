<div class="flex items-center gap-3 mb-6 flex-wrap">
  <div class="flex items-center border border-gray-300 rounded-lg px-4 h-[40px] w-[343px] bg-white gap-2 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500">
    <img src="assets/search icon.svg" class="w-4 h-4 flex-shrink-0" alt="search" />
    <input #searchInput type="text"
      class="border-none outline-none text-xs font-normal text-text-main w-full bg-transparent focus:ring-0"
      placeholder="Search subscribers..."
      (input)="onSearchInput($any($event.target).value)" />
    <button *ngIf="searchText" type="button"
      class="flex items-center justify-center w-4 h-4 text-gray-400 hover:text-gray-600 cursor-pointer bg-transparent border-none p-0"
      (click)="clearSearch(searchInput)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-3.5 h-3.5">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="toolbar-dd">
    <lib-dropdown-lib
      label=""
      placeholder="Select meal slots"
      [singleSelection]="false"
      [data]="mealSlotList"
      [idField]="dropdownIdField"
      [textField]="dropdownTextField"
      [selectedItems]="selectedMealSlots"
      triggerHeight="40px"
      (selectionChange)="onMealSlotChange($event)">
    </lib-dropdown-lib>
  </div>

  <div class="toolbar-dd">
    <lib-dropdown-lib
      label=""
      placeholder="Select status"
      [singleSelection]="false"
      [data]="statusData"
      [idField]="dropdownIdField"
      [textField]="dropdownTextField"
      [selectedItems]="selectedStatuses"
      triggerHeight="40px"
      (selectionChange)="onStatusChange($event)">
    </lib-dropdown-lib>
  </div>

  <button *ngIf="searchText || selectedMealSlots.length || selectedStatuses.length"
    type="button" class="clear-filters-btn flex items-center gap-1.5 px-3 cursor-pointer"
    (click)="onClearFilters()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-3.5 h-3.5">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
    Clear Filters
  </button>

  <div class="ml-auto flex gap-2.5">
    <lib-button type="primary" label="Add Subscriber" (onClick)="onAddSubscriber()"></lib-button>
    <button type="button" class="export-btn flex items-center gap-2 px-4 cursor-pointer" (click)="exportCSV()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-4 h-4">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Export
    </button>
  </div>
</div>

<lib-table
  [columns]="columns"
  [data]="subscribers"
  [loading]="isLoading"
  [primaryActions]="primaryActions"
  [pagination]="paginationConfig"
  [clientPagination]="clientPaginationMode"
  [showToolbar]="false"
  [stickyActions]="false"
  (onPrimaryAction)="onPrimaryAction($event)"
  (onPageChange)="onPageChange($event)"
  (onItemsPerPageChange)="onSizeChange($event)"
></lib-table>
