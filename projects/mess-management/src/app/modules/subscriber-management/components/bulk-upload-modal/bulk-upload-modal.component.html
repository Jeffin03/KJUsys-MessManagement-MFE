<div *ngIf="isOpen" class="fixed inset-0 bg-black/55 z-[1000] flex items-center justify-center p-4" (click)="onClose()">
    <div class="bg-white rounded-[14px] w-full max-w-[500px] shadow-[0_24px_64px_rgba(0,0,0,0.18)] font-sans"
        (click)="$event.stopPropagation()">

        <div class="flex items-start justify-between px-4 sm:px-7 pt-6 pb-[18px] border-b border-gray-200">
            <div>
                <h2 class="text-sm font-bold m-0 mb-1 leading-tight" style="color:#1D1D1F;">Bulk Upload Subscribers</h2>
                <p class="text-xs m-0" style="color:#86868B;">Upload an Excel file (.xls/.xlsx) with subscriber data</p>
            </div>
            <button class="bg-transparent border-none text-base cursor-pointer px-1.5 py-0.5 leading-none mt-0.5"
                style="color:#86868B;" (click)="onClose()">&#x2715;</button>
        </div>

        <div class="px-4 sm:px-7 py-6">
            <lib-file-upload
                accept=".xls,.xlsx"
                title="Select an Excel file or drag and drop here"
                hint="Supports .xls and .xlsx files"
                (fileChange)="onFileChange($event)">
            </lib-file-upload>

            <div *ngIf="uploadResult" class="mt-4 p-3 rounded-lg text-xs"
                [class.bg-green-50]="!uploadResult.includes('failed')"
                [class.text-green-700]="!uploadResult.includes('failed')"
                [class.bg-red-50]="uploadResult.includes('failed')"
                [class.text-red-700]="uploadResult.includes('failed')">
                {{ uploadResult }}
            </div>

            <div class="mt-4 text-[10px]" style="color:#9CA3AF;">
                <p class="m-0">Expected columns: Name, Admission Number, Class, Section, Hostel Name, Hostel Warden</p>
            </div>
        </div>

        <div class="flex items-center justify-between px-4 sm:px-7 py-4 border-t border-gray-200">
            <lib-button type="secondary" label="Cancel" (onClick)="onClose()"></lib-button>
            <lib-button type="primary" label="Upload" [disabled]="!selectedFile || uploading" [loading]="uploading" (onClick)="onUpload()"></lib-button>
        </div>

    </div>
</div>
