<div *ngIf="isOpen" class="fixed inset-0 bg-black/55 z-[1000] flex items-center justify-center p-4" (click)="onClose()">
    <div class="bg-white rounded-[14px] w-full max-w-[700px] h-[800px] max-h-[92vh] flex flex-col shadow-[0_24px_64px_rgba(0,0,0,0.18)] font-sans"
        (click)="$event.stopPropagation()">

        <!-- Header -->
        <div class="flex items-start justify-between px-7 pt-6 pb-[18px] border-b border-gray-200 shrink-0">
            <div>
                <h2 class="text-sm font-bold m-0 mb-1 leading-tight" style="color:#1D1D1F;">Add Subscriber</h2>
                <p class="text-xs m-0" style="color:#86868B;">Add subscriber details and meal plans</p>
            </div>
            <button class="bg-transparent border-none text-base cursor-pointer px-1.5 py-0.5 leading-none mt-0.5"
                style="color:#86868B;" (click)="onClose()">&#x2715;</button>
        </div>

        <!-- Subscriber Form (scrollable) -->
        <div class="overflow-y-auto overflow-x-visible flex-1 min-h-0">
            <app-subscriber-form
                [mealSlots]="mealSlots"
                (formSubmit)="onSave($event)"
                (formCancel)="onClose()"
                (formValidChange)="onFormValidChange($event)">
            </app-subscriber-form>
        </div>

        <!-- Footer -->
        <div class="flex items-center justify-between px-7 py-4 border-t border-gray-200 shrink-0">
            <lib-button type="secondary" label="Cancel" (onClick)="onClose()"></lib-button>
            <lib-button type="primary" label="Save" (onClick)="formComponent.onSubmit()"></lib-button>
        </div>

    </div>
</div>
