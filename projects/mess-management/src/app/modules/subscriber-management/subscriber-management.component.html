<div class="flex flex-col min-h-screen bg-[#FAFAFC] font-['Inter',sans-serif]">
  <div class="flex-1 p-5 pb-12">
    <!-- Breadcrumb -->
    <div class="mb-3">
      <lib-breadcrumbs-title title="Mess Management" [breadcrumbs]="breadcrumbs"></lib-breadcrumbs-title>
    </div>
    <!-- Tab Bar -->
    <div class="mb-5 w-full">
      <lib-tabs [tabs]="tabs" [activeTabId]="activeTab" (tabChange)="onTabChange($event)"></lib-tabs>
    </div>
    <!-- Student Detail -->
    <app-student-detail *ngIf="selectedStudentRollNumber" [rollNumber]="selectedStudentRollNumber" (back)="backFromStudentDetail()"></app-student-detail>

    <!-- Stats -->
    <app-subscriber-stats *ngIf="!selectedStudentRollNumber" [stats]="stats"></app-subscriber-stats>
    <!-- Table -->
    <app-subscriber-table *ngIf="!selectedStudentRollNumber" [subscribers]="subscribers" [isLoading]="isLoading" [mealSlotList]="mealSlotList"
      [totalItems]="totalItems" [currentPage]="currentPage" [pageSize]="pageSize"
      [clientPaginationMode]="clientPaginationMode"
      [selectedMealSlots]="selectedMealSlots" [selectedStatuses]="selectedStatuses"
      [expiryFilterDays]="expiryFilterDays"
      (addSubscriber)="openAddModal()"
      (editSubscriber)="openEditModal($event)"
      (deleteSubscriber)="requestDeleteSubscriber($event)"
      (viewSubscriber)="openQuickModal($event)"
      (searchChange)="onSearchChange($event)"
      (mealSlotChange)="onMealSlotChange($event)"
      (statusChange)="onStatusChange($event)"
      (expiryChange)="onExpiryChange($event)"
      (pageChange)="onPageChange($event)"
      (sizeChange)="onSizeChange($event)"
      (exportRequest)="onExportRequest()"
      (clearFilters)="fetchInitialData()"></app-subscriber-table>
  </div>
  <!-- Footer -->
  <footer class="py-2 px-6 text-center bg-[#434B57] border-t border-[#E5E7EB]">
    <p class="text-xs text-white">© Developed by : Software Development Centre, Kristu Jayanti (Deemed to be
      University), Bangalore</p>
  </footer>
</div>

<app-add-subscriber-modal [hidden]="!showAddModal" [isOpen]="showAddModal" (close)="closeAddModal()"
  (save)="onSubscriberSave($event)">
</app-add-subscriber-modal>

<app-edit-subscriber-modal [hidden]="!showEditModal" [isOpen]="showEditModal" [subscriber]="editSubscriberData"
  (close)="closeEditModal()" (update)="updateSubscriber($event)">
</app-edit-subscriber-modal>

<app-quick-modal [visible]="showQuickModal" [rollNumber]="quickModalRollNumber" (close)="showQuickModal = false"></app-quick-modal>

<!-- Delete Confirmation Popup -->
<div *ngIf="showDeleteConfirmPopup" class="fixed z-[100] flex items-center justify-center inset-0" style="background:rgba(0,0,0,.15);">
    <div class="relative bg-white rounded-2xl shadow-[0_8px_40px_rgba(0,0,0,0.12)] w-full max-w-xs mx-4 px-8 py-8 flex flex-col items-center gap-5">

        <!-- × close button -->
        <button (click)="cancelDeleteSubscriber()"
            class="absolute top-4 right-4 text-[#9CA3AF] hover:text-[#374151] transition-colors text-lg leading-none p-1">
            ✕
        </button>

        <!-- Grey exclamation circle -->
        <img src="assets/exclamation-circle.svg" class="w-16 h-16" />

        <!-- Message -->
        <p class="text-[15px] font-semibold text-[#111827] text-center leading-6">
            Are you sure you want to delete {{ pendingDeleteSubscriber?.name }} [{{ pendingDeleteSubscriber?.roll_number }}]?
        </p>

        <!-- Buttons -->
        <div class="flex gap-3 w-full *:flex-1 *:w-full">
            <lib-button type="secondary" label="No, cancel" (onClick)="cancelDeleteSubscriber()"></lib-button>
            <lib-button type="primary" label="Confirm" (onClick)="confirmDeleteSubscriber()"></lib-button>
        </div>
    </div>
</div>
