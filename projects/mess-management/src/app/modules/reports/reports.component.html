<div class="flex flex-col min-h-screen bg-[#FAFAFC] font-['Inter',sans-serif]">
  <div class="flex-1 p-5 pb-12">
    <div class="mb-3">
      <lib-breadcrumbs-title title="Mess Management" [breadcrumbs]="breadcrumbs"></lib-breadcrumbs-title>
    </div>
    <div class="mb-5 w-full">
      <lib-tabs [tabs]="tabs" [activeTabId]="activeTab" (tabChange)="onTabChange($event)"></lib-tabs>
    </div>

    <div class="grid grid-cols-[1fr_auto] items-center mb-5 gap-3">
      <lib-sub-tabs [tabs]="subTabs" [activeTabId]="activeSubTab" (tabChange)="onSubTabChange($event)"></lib-sub-tabs>
      <lib-button *ngIf="activeSubTab === 'dashboard'" type="primary" label="Export" (onClick)="onExportClick()"></lib-button>
    </div>

    <app-reports-dashboard *ngIf="activeSubTab === 'dashboard'"></app-reports-dashboard>
    <app-audit-tools *ngIf="activeSubTab === 'audit'"></app-audit-tools>
  </div>
</div>
